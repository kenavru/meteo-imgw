<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMGW – produkty specjalne</title>
<style>
  /* Variables are set from the parent Home Assistant document (same-origin
     iframe) or from prefers-color-scheme when the file is opened directly. */
  :root {
    --card: #ffffff; --bg: #f5f5f5; --text: #1d2939; --muted: #667085;
    --line: #d0d5dd; --accent: #00359E; --err-bg: #fdecec; --err: #a12622;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: .75rem; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 1.1rem; margin: 0 0 .6rem; color: var(--accent); }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .75rem; }
  button, select { padding: .4rem .7rem; border: 1px solid var(--line); border-radius: 8px;
                   background: var(--card); color: var(--accent); font: inherit; cursor: pointer; }
  .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card h2 { margin: 0; padding: .5rem .7rem; font-size: .9rem; font-weight: 600;
             border-bottom: 1px solid var(--line); }
  video { display: block; width: 100%; background: #000; }
  .meta { padding: .45rem .7rem; font-size: .72rem; color: var(--muted); word-break: break-all; }
  .meta a { color: var(--accent); }
  footer { margin-top: .6rem; font-size: .7rem; color: var(--muted); display: flex;
           justify-content: space-between; gap: .5rem; }
  .err { padding: .8rem; background: var(--err-bg); color: var(--err); border-radius: 8px; }
  /* Embedded in a Lovelace iframe card: no title, no toolbar, tighter padding. */
  body.embed { padding: .35rem; }
  body.embed h1, body.embed .bar { display: none; }
  body.embed .meta { padding: .35rem .55rem; }
</style>
</head>
<body>
  <h1>IMGW-PIB — produkty specjalne</h1>

  <div class="bar">
    <button id="reload">Odśwież</button>
    <label>Auto <select id="every">
      <option value="0">wyłączone</option>
      <option value="60">co 1 min</option>
      <option value="600" selected>co 10 min</option>
      <option value="1800">co 30 min</option>
    </select></label>
    <span id="stamp-standalone"></span>
  </div>

  <div id="out" class="grid"></div>
  <footer><span id="stamp"></span><span>źródło: meteo.imgw.pl</span></footer>

<script>
// Same endpoint the Angular site meteo.imgw.pl uses for its <video> tags.
const API = 'https://meteo.imgw.pl/api/v1/products/cmm-maps';
const TOKEN = 'p4DXKjsYadfBV21TYrDk';   // publiczny apiToken z main.*.js
const BASE = 'https://meteo.imgw.pl';
const ITEMS = [
  { key: 'inca_t2m', title: 'INCA — temperatura' },
  { key: 'merge',    title: 'MERGE — suma opadów' },
];
const REFRESH_SECONDS = 600;

const params = new URLSearchParams(location.search);
const embed = params.has('embed') || window.self !== window.top;
if (embed) document.body.classList.add('embed');

// Inherit Home Assistant's theme colours; fall back to system dark mode.
const HA_VARS = { '--card': '--card-background-color', '--bg': '--secondary-background-color',
                  '--text': '--primary-text-color', '--muted': '--secondary-text-color',
                  '--line': '--divider-color', '--accent': '--primary-color' };
try {
  const cs = getComputedStyle(window.parent.document.documentElement);
  for (const [local, remote] of Object.entries(HA_VARS)) {
    const v = cs.getPropertyValue(remote).trim();
    if (v) document.documentElement.style.setProperty(local, v);
  }
} catch (e) { /* opened standalone or cross-origin: keep defaults */ }
if (matchMedia('(prefers-color-scheme: dark)').matches)
  document.body.classList.add('dark');

const out = document.getElementById('out');
const stamp = document.getElementById('stamp');
const stampSa = document.getElementById('stamp-standalone');

async function load() {
  try {
    const q = ITEMS.map((it, i) => `products[${i}]=${it.key}`).join('&');
    const r = await fetch(`${API}?token=${TOKEN}&${q}&lang=pl&_=${Date.now()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = (await r.json()).data;

    out.innerHTML = '';
    for (const it of ITEMS) {
      const item = data?.[it.key];
      const card = document.createElement('div');
      card.className = 'card';
      if (!item?.image) {
        card.innerHTML = `<h2>${it.title}</h2><div class="meta">Brak danych w odpowiedzi API.</div>`;
      } else {
        const url = BASE + item.image;
        const when = item.modifiedTime
          ? new Date(item.modifiedTime * 1000).toLocaleString() : '?';
        card.innerHTML = `<h2>${it.title}</h2>
          <video controls loop autoplay muted playsinline src="${url}"></video>
          <div class="meta">opublikowano: ${when} · <a href="${url}" target="_blank"
            rel="noopener">${item.image.split('/').pop()}</a></div>`;
      }
      out.appendChild(card);
    }
    const now = 'aktualizacja: ' + new Date().toLocaleTimeString();
    stamp.textContent = now;
    stampSa.textContent = now;
  } catch (e) {
    out.innerHTML = `<div class="err">Nie udało się pobrać adresów: ${e.message}.
      Jeżeli IMGW zmienił apiToken, wyciągnij nowy z main.*.js.</div>`;
  }
}

load();
let timer = setInterval(load, REFRESH_SECONDS * 1000);

document.getElementById('reload').onclick = load;
document.getElementById('every').onchange = (ev) => {
  clearInterval(timer);
  const s = +ev.target.value;
  if (s) timer = setInterval(load, s * 1000);
};
</script>
</body>
</html>
